$font = Monospace

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(36, 39, 58, 0.8)
    outer_color = rgba(138, 173, 244, 0.9)
    check_color = rgba(166, 218, 149, 0.9)
    fail_color = rgba(237, 135, 150, 0.9)
    font_color = rgb(202, 211, 245)
    fade_on_empty = false
    rounding = 0
    font_family = $font
    placeholder_text = Senha...
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgba(202, 211, 245, 1.0)
    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    color = rgba(183, 189, 248, 1.0)
    position = -30, -150
    halign = right
    valign = top
}
